<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WareFlow AI • Analytics</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#0d1117;

font-family:Inter,Arial,sans-serif;

color:white;

}

.analytics-wrapper{

padding:35px;

margin-left:260px;

transition:.3s;

}

.analytics-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.analytics-header h1{

font-size:34px;

font-weight:700;

}

.analytics-header p{

margin-top:8px;

color:#8b949e;

}

.dashboard-btn{

background:#00e5a8;

color:#000;

padding:12px 18px;

border-radius:10px;

font-weight:700;

text-decoration:none;

}

.kpi-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:22px;

margin-bottom:35px;

}

.kpi-card{

background:#161b22;

border:1px solid #30363d;

border-radius:18px;

padding:25px;

display:flex;

align-items:center;

gap:18px;

transition:.25s;

}

.kpi-card:hover{

transform:translateY(-5px);

border-color:#00e5a8;

}

.kpi-icon{

width:60px;

height:60px;

border-radius:14px;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

background:rgba(0,229,168,.12);

}

.kpi-text{

display:flex;

flex-direction:column;

}

.kpi-text span{

color:#8b949e;

font-size:14px;

}

.kpi-text strong{

margin-top:6px;

font-size:34px;

}

@media(max-width:1200px){

.analytics-wrapper{

margin-left:0;

padding:25px;

}

.kpi-grid{

grid-template-columns:repeat(2,1fr);

}

}

@media(max-width:700px){

.kpi-grid{

grid-template-columns:1fr;

}

.analytics-header{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

}

</style>

</head>

<body>

<div class="analytics-wrapper">

<div class="analytics-header">

<div>

<h1>Warehouse Analytics</h1>

<p>
Real-time warehouse intelligence dashboard
</p>

</div>

<a href="/dashboard" class="dashboard-btn">

← Dashboard

</a>

</div>

<div class="kpi-grid">

<div class="kpi-card">

<div class="kpi-icon">📦</div>

<div class="kpi-text">

<span>Total Products</span>

<strong>{{ total_products }}</strong>

</div>

</div>

<div class="kpi-card">

<div class="kpi-icon">📈</div>

<div class="kpi-text">

<span>Total Units</span>

<strong>{{ total_units }}</strong>

</div>

</div>

<div class="kpi-card">

<div class="kpi-icon">⚠️</div>

<div class="kpi-text">

<span>Low Stock</span>

<strong>{{ low_stock }}</strong>

</div>

</div>

<div class="kpi-card">

<div class="kpi-icon">🚨</div>

<div class="kpi-text">

<span>Out Of Stock</span>

<strong>{{ out_of_stock }}</strong>

</div>

</div>

</div>
