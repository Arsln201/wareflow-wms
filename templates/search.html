<!DOCTYPE html>
<html>
<head>
    <title>Search Location</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h1>📍 Search Warehouse Location</h1>

    <form action="/result" method="POST">

        <input
            type="text"
            name="location"
            placeholder="Example: A12-04-B"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

</div>

</body>
</html>
