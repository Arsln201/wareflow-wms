<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WareFlow AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h1>WareFlow AI</h1>

    <p>Smart Warehouse Operations Platform</p>

 <form method="POST" action="/login">

    <input
        type="text"
        name="employee_id"
        placeholder="Employee ID"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Login</button>

</form>

</div>

</body>
</html>
