<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | WareFlow WMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-box">

    <h1>Add Product</h1>

    <p>Create a new warehouse product</p>

    {% if error %}
        <p style="color: #d64545;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="product_name"
            placeholder="Product Name"
            required
        >

        <input
            type="text"
            name="sku"
            placeholder="SKU"
            required
        >

        <input
            type="text"
            name="category"
            placeholder="Category"
            required
        >

        <input
            type="number"
            name="quantity"
            placeholder="Quantity"
            min="0"
            value="0"
            required
        >

        <input
            type="text"
            name="supplier"
            placeholder="Supplier"
        >

        <input
            type="text"
            name="rack"
            placeholder="Rack"
            required
        >

        <input
            type="text"
            name="shelf"
            placeholder="Shelf"
            required
        >

        <input
            type="text"
            name="bin"
            placeholder="Bin"
            required
        >

        <button type="submit">
            Save Product
        </button>

    </form>

    <br>

    <button onclick="location.href='/inventory'">
        Back
    </button>

</div>

</body>
</html>
