<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Warehouse QR Label | WareFlow WMS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        @media print {

            body {
                background: white;
            }

            .qr-container {
                color: black;
                box-shadow: none;
                border: none;
            }

            .qr-actions {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="qr-container">

    <h1>WareFlow WMS</h1>

    <p>Warehouse Location Label</p>

    <hr>

    <h2>{{ product.product_name }}</h2>

    <p>
        <strong>SKU:</strong>
        {{ product.sku }}
    </p>

    <p>
        <strong>Category:</strong>
        {{ product.category }}
    </p>

    <p>
        <strong>Quantity:</strong>
        {{ product.quantity }}
    </p>

    <p>
        <strong>Rack:</strong>
        {{ product.rack }}
    </p>

    <p>
        <strong>Shelf:</strong>
        {{ product.shelf }}
    </p>

    <p>
        <strong>Bin:</strong>
        {{ product.bin }}
    </p>

    <img
        src="{{ qr_image }}"
        alt="Warehouse QR Code"
    >

    <h2>
        {{ location }}
    </h2>

    <div class="qr-actions">

        <button onclick="window.print()">
            Print Label
        </button>

        <button onclick="location.href='/qr-management'">
            QR Management
        </button>

        <button onclick="location.href='/inventory'">
            Inventory
        </button>

        <button onclick="location.href='/dashboard'">
            Dashboard
        </button>

    </div>

</div>

</body>
</html>
